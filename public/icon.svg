<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />

  <!-- Sheet of Paper / Invoice Body with drop shadow -->
  <g filter="url(#shadow)">
    <rect x="110" y="80" width="292" height="352" rx="24" fill="#ffffff" />
    
    <!-- Top Bar inside Invoice -->
    <rect x="140" y="116" width="120" height="20" rx="6" fill="#1e40af" />
    <circle cx="360" cy="126" r="14" fill="#10b981" />

    <!-- Invoice Header lines -->
    <rect x="140" y="156" width="160" height="10" rx="5" fill="#94a3b8" />
    <rect x="140" y="176" width="90" height="10" rx="5" fill="#cbd5e1" />

    <!-- Table Header in Invoice -->
    <rect x="140" y="212" width="232" height="28" rx="6" fill="#f1f5f9" />
    <rect x="154" y="222" width="40" height="8" rx="4" fill="#64748b" />
    <rect x="230" y="222" width="50" height="8" rx="4" fill="#64748b" />
    <rect x="315" y="222" width="40" height="8" rx="4" fill="#64748b" />

    <!-- Table Rows -->
    <rect x="140" y="254" width="232" height="1" fill="#e2e8f0" />
    <rect x="154" y="266" width="60" height="8" rx="4" fill="#334155" />
    <rect x="240" y="266" width="30" height="8" rx="4" fill="#64748b" />
    <rect x="315" y="266" width="40" height="8" rx="4" fill="#0f172a" />

    <rect x="140" y="286" width="232" height="1" fill="#e2e8f0" />
    <rect x="154" y="298" width="75" height="8" rx="4" fill="#334155" />
    <rect x="240" y="298" width="30" height="8" rx="4" fill="#64748b" />
    <rect x="315" y="298" width="40" height="8" rx="4" fill="#0f172a" />

    <rect x="140" y="318" width="232" height="1" fill="#e2e8f0" />
    <rect x="154" y="330" width="50" height="8" rx="4" fill="#334155" />
    <rect x="240" y="330" width="30" height="8" rx="4" fill="#64748b" />
    <rect x="315" y="330" width="40" height="8" rx="4" fill="#0f172a" />

    <!-- Total highlight bar -->
    <rect x="230" y="360" width="142" height="32" rx="8" fill="url(#accentGrad)" />
    <rect x="245" y="372" width="45" height="8" rx="4" fill="#ffffff" opacity="0.85" />
    <rect x="315" y="370" width="42" height="12" rx="4" fill="#ffffff" />
  </g>
</svg>
